---
name: Release Binaries

# The token only ever needs to publish release assets. Declared empty here so
# that any job added later starts with no permission at all and has to opt in.
permissions: {}

# crystalline is the Crystal LSP server, only needed in an editor.
# Its macOS binary (>= 0.18.0) is dynamically linked against
# /opt/homebrew/opt/llvm/lib/libLLVM.dylib, which is absent on the runners,
# so the plugin post_install check fails. Releasing never uses it, so skip
# installing it. The value must be the tool name exactly as declared in
# mise.toml. Shortening it to `crystalline` matches nothing: mise disables no
# tool, and the macOS jobs fail again on the post_install check.
env:
  MISE_DISABLE_TOOLS: aqua:elbywan/crystalline

on:
  push:
    tags:
      - '*'

jobs:
  # The release is created once, up front. When the three build jobs each
  # created it themselves, they raced on the same tag: whichever lost could
  # fail and leave the release short of a platform.
  create_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create the release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true

  release_linux:
    needs: create_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Build static binaries
        run: mise release:static

      - name: Publish assets
        uses: ncipollo/release-action@v1
        with:
          artifacts: "packages/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          # The release already exists: only add assets to it. Rewriting the
          # body or the name would let the three jobs clobber each other.
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

  release_macos_arm64:
    needs: create_release
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install bdw-gc
        run: brew install bdw-gc

      - name: Setup mise
        uses: jdx/mise-action@v4

      # TODO: remove me when https://github.com/crystal-lang/crystal/issues/16746 is fixed
      - name: Fix Crystal shards
        run: mise dev:fix-shards-command

      - name: Install dependencies
        run: mise release:deps

      - name: Build binary
        run: mise release:build
        env:
          OUTPUT_FILE: bin/icinga-pagerduty-darwin-arm64

      - name: Publish assets
        uses: ncipollo/release-action@v1
        with:
          # Restricted to the binary just built: a bare `bin/*` would also
          # publish anything else that landed in bin/.
          artifacts: "bin/icinga-pagerduty-darwin-arm64*"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

  release_macos_amd64:
    needs: create_release
    runs-on: macos-26-intel
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install bdw-gc
        run: brew install bdw-gc

      - name: Setup mise
        uses: jdx/mise-action@v4

      # TODO: remove me when https://github.com/crystal-lang/crystal/issues/16746 is fixed
      - name: Fix Crystal shards
        run: mise dev:fix-shards-command

      - name: Install dependencies
        run: mise release:deps

      - name: Build binary
        run: mise release:build
        env:
          OUTPUT_FILE: bin/icinga-pagerduty-darwin-amd64

      - name: Publish assets
        uses: ncipollo/release-action@v1
        with:
          # Restricted to the binary just built: a bare `bin/*` would also
          # publish anything else that landed in bin/.
          artifacts: "bin/icinga-pagerduty-darwin-amd64*"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
